# Supabase CLI configuration — BookHero / The Chronicler
# Linked project: zlndhygpqacygceivuvk
#
# Per-function settings are committed here so a deploy from the repo reproduces
# production (BC-02 / PLT-61). Every function verifies the caller's JWT at the
# gateway (verify_jwt = true); the AI functions also re-verify in code through
# supabase/functions/_shared/auth.ts (defence in depth).
#
# log-geo (activity-log feature) is intentionally not managed here.

project_id = "zlndhygpqacygceivuvk"

[functions.generate-recap]
verify_jwt = true
import_map = "./functions/generate-recap/deno.json"

